name: Personal isolation test pages
on:
  push:
    branches: [main]
    paths: ['test-pages/**', 'tools/isolation-tests/**', 'pyproject.toml',
            '.github/workflows/isolation-test-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-pages
  cancel-in-progress: false
jobs:
  build:
    # Runs only in the repository owned by the account stored in PERSONAL_OWNER.
    if: github.repository_owner == vars.PERSONAL_OWNER
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/setup-python v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: isolation-build-pages --manifest tools/isolation-tests/cases.json --output test-pages --commit "$GITHUB_SHA"
      - run: python -m isolation_tests.publish_guard artifact test-pages
      # configure-pages is intentionally not used: its outputs are not needed for a
      # plain static artifact, and it would require extra Pages permissions in this job.
      # actions/upload-pages-artifact v4
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: test-pages
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # actions/deploy-pages v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

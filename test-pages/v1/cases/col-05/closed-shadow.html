<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>닫힌 Shadow DOM 안내</title></head><body><main><div data-test="closed-shadow-host">닫힌 Shadow DOM 호스트</div><p>닫힌 Shadow DOM 내부 내용은 미확인입니다.</p><script>
const root = document.querySelector('[data-test="closed-shadow-host"]').attachShadow({mode: 'closed'});
root.innerHTML = '<p data-test="closed-shadow-marker">닫힌 Shadow DOM 표지</p>';
</script>
<p>합성 테스트 자료입니다.</p></main></body></html>
